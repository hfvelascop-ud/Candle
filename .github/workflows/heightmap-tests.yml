name: Heightmap interpolation tests

on:
  push:
    branches: [heightmap-bilineal]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ qtbase5-dev
      - name: Configure
        run: cmake -S tests -B build-tests -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build-tests --parallel 2
      - name: Test
        run: ctest --test-dir build-tests --output-on-failure
